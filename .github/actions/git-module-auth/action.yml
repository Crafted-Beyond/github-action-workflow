name: Configure Git for private modules
description: Configure temporary GitHub authentication for private Git-sourced Terraform modules.

inputs:
  token:
    description: GitHub token with read access to private Terraform module repositories.
    required: false

runs:
  using: composite
  steps:
    - name: Configure Git authentication
      if: ${{ inputs.token != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        config="$RUNNER_TEMP/tofu-gitconfig"
        umask 077
        : > "$config"
        # A URL rewrite, not an http.extraheader: git sends these credentials only
        # when the server asks for them, so actions/checkout's own Authorization
        # header (state pull and push) is never duplicated (GitHub answers 400).
        host="${GITHUB_SERVER_URL#https://}"
        git config --file "$config" "url.https://x-access-token:${GH_TOKEN}@${host}/.insteadOf" "${GITHUB_SERVER_URL}/"
        printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"

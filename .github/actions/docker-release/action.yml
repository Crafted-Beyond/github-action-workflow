name: Docker release control
description: Validate release labels, serialize publications, version Git tags and delete PR image tags.
inputs:
  operation:
    required: true
    description: prepare, preflight, finalize, unlock, build-cleanup, deployment-prepare, deployment-lock, deployment-plan-check, deployment-outputs, deployment-complete, deployment-cleanup, preview-cleanup-prepare, preview-cleanup-lock, preview-cleanup-verify or report.
outputs:
  working_directory:
    value: ${{ steps.control.outputs.working_directory }}
    description: Trusted central application Terraform root.
  namespace:
    value: ${{ steps.control.outputs.namespace }}
    description: Namespace returned by Terraform.
  argocd_namespace:
    value: ${{ steps.control.outputs.argocd_namespace }}
    description: Argo CD namespace returned by Terraform.
  route_enabled:
    value: ${{ steps.control.outputs.route_enabled }}
    description: Whether Terraform configured HTTPRoute.
  preview:
    value: ${{ steps.control.outputs.preview }}
    description: Whether this command requests an isolated PR preview.
  pr:
    value: ${{ steps.control.outputs.pr }}
    description: Pull request number.
  name:
    value: ${{ steps.control.outputs.name }}
    description: Deployment identity.
  hostname:
    value: ${{ steps.control.outputs.hostname }}
    description: Deployment hostname.
  environment:
    value: ${{ steps.control.outputs.environment }}
    description: State environment.
  state_path:
    value: ${{ steps.control.outputs.state_path }}
    description: Isolated Git state directory.
  healthy:
    value: ${{ steps.control.outputs.healthy }}
    description: Argo CD reported the requested source synced and healthy.
  publish:
    value: ${{ steps.control.outputs.publish }}
    description: False when a recorded release needs cleanup only.
  digest:
    value: ${{ steps.control.outputs.digest }}
    description: Recorded release digest on a cleanup retry.
  build:
    value: ${{ steps.control.outputs.build }}
    description: Whether this event should publish an image.
  mode:
    value: ${{ steps.control.outputs.mode }}
    description: pr or release.
  sha:
    value: ${{ steps.control.outputs.sha }}
    description: Immutable source commit.
  tag:
    value: ${{ steps.control.outputs.tag }}
    description: Container tag.
  image:
    value: ${{ steps.control.outputs.image }}
    description: Fully qualified tagged image.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26.x"
        cache: false
    - id: control
      shell: bash
      env:
        DOCKER_CONTROL_PATH: ${{ github.action_path }}
        DOCKER_CONTROL_OPERATION: ${{ inputs.operation }}
        GH_TOKEN: ${{ env.GH_TOKEN || github.token }}
      run: |
        go -C "$DOCKER_CONTROL_PATH" run . "$DOCKER_CONTROL_OPERATION"

name: Pull request comment
description: Creates or updates a single pull request comment identified by a marker, so reruns edit it instead of adding new ones.

inputs:
  token:
    description: Token allowed to write pull request comments.
    default: ${{ github.token }}
  body_file:
    description: Markdown file with the comment body.
    required: true
  marker:
    description: Unique id for this comment, so each stack keeps its own comment.
    required: true
  pr_number:
    description: Pull request number.
    default: ${{ github.event.pull_request.number }}

runs:
  using: composite
  steps:
    - name: Create or update the PR comment
      uses: actions/github-script@v7
      env:
        BODY_FILE: ${{ inputs.body_file }}
        MARKER: ${{ inputs.marker }}
        PR_NUMBER: ${{ inputs.pr_number }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const marker = `<!-- ${process.env.MARKER} -->`;
          const issue_number = Number(process.env.PR_NUMBER);
          const limit = 65000 - marker.length;

          let body = fs.readFileSync(process.env.BODY_FILE, 'utf8');
          if (body.length > limit) {
            body = body.slice(0, limit - 60) + '\n\n_Comment truncated, see the workflow run._';
          }
          body = `${marker}\n${body}`;

          const { owner, repo } = context.repo;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find((c) => c.body && c.body.startsWith(marker));

          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

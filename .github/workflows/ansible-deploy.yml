name: CraftedBeyond Ansible runner

on:
  workflow_call:
    inputs:
      playbook:
        description: Caller repository playbook path
        type: string
        required: true
      inventory:
        description: Caller repository inventory path
        type: string
        required: true
      tags:
        description: Comma-separated Ansible tags to run
        type: string
        required: true
      extra_vars_json:
        description: JSON object of nonsecret Ansible variables
        type: string
        required: false
        default: "{}"
      secret_var_mappings:
        description: Newline-separated Ansible variable=caller secret name mappings; a trailing ? (variable=SECRET?) skips a secret that is not set
        type: string
        required: false
        default: ""
      validation_playbooks:
        description: Space-separated validation playbook paths
        type: string
        required: false
        default: ""
      validation_scripts:
        description: Space-separated validation script paths, run with bash
        type: string
        required: false
        default: ""
      validation_inventory:
        description: Inventory used for validation playbooks
        type: string
        required: false
        default: localhost,
      ansible_requirements_file:
        description: Optional requirements file in the caller repository
        type: string
        required: false
        default: ""
      ansible_collections:
        description: Comma-separated Ansible collections to install
        type: string
        required: false
        default: community.general
      python_version:
        description: Python version used for Ansible
        type: string
        required: false
        default: "3.13"
      working_directory:
        description: Working directory in the caller repository
        type: string
        required: false
        default: .
      install_cloudflared:
        description: Install cloudflared for SSH proxying
        type: boolean
        required: false
        default: false
      ssh_private_key_secret_name:
        description: Caller secret name containing the SSH private key
        type: string
        required: true
      ssh_proxy_command:
        description: Optional SSH ProxyCommand template; use {hostname} for each inventory host
        type: string
        required: false
        default: ""
      checkout_repository:
        description: Optional extra repository to check out into the caller workspace
        type: string
        required: false
        default: ""
      checkout_ref:
        description: Ref for the optional extra repository
        type: string
        required: false
        default: main
      checkout_path:
        description: Workspace-relative path for the optional extra repository
        type: string
        required: false
        default: .ansible-sources/dependency
      checkout_token_secret_name:
        description: Optional inherited secret name used to check out the extra repository
        type: string
        required: false
        default: ""
      checkout_token_fallback_secret_name:
        description: Optional fallback inherited secret name for the extra checkout
        type: string
        required: false
        default: ""
      check_connectivity:
        description: Ping all inventory hosts before running the playbook
        type: boolean
        required: false
        default: true
      concurrency_group:
        description: Shared deployment concurrency group
        type: string
        required: false
        default: ansible-deployment
permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency_group }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANSIBLE_FORCE_COLOR: "1"
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Check out caller repository
        uses: actions/checkout@v4

      - name: Check out optional dependency repository
        if: inputs.checkout_repository != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository }}
          ref: ${{ inputs.checkout_ref }}
          path: ${{ inputs.checkout_path }}
          token: ${{ (inputs.checkout_token_secret_name != '' && secrets[inputs.checkout_token_secret_name]) || (inputs.checkout_token_fallback_secret_name != '' && secrets[inputs.checkout_token_fallback_secret_name]) || github.token }}
          persist-credentials: false

      - name: Set up Ansible environment
        uses: Crafted-Beyond/github-action-workflow/.github/actions/setup-ansible@main
        with:
          python_version: ${{ inputs.python_version }}
          requirements_file: ${{ inputs.ansible_requirements_file }}
          collections: ${{ inputs.ansible_collections }}
          working_directory: ${{ inputs.working_directory }}

      - name: Set up SSH and inventory
        uses: Crafted-Beyond/github-action-workflow/.github/actions/setup-ansible-ssh@main
        with:
          inventory: ${{ inputs.inventory }}
          working_directory: ${{ inputs.working_directory }}
          ssh_private_key: ${{ secrets[inputs.ssh_private_key_secret_name] }}
          ssh_proxy_command: ${{ inputs.ssh_proxy_command }}
          install_cloudflared: ${{ inputs.install_cloudflared }}
          extra_vars_json: ${{ inputs.extra_vars_json }}
          secret_var_mappings: ${{ inputs.secret_var_mappings }}
          caller_secrets_json: ${{ toJSON(secrets) }}

      - name: Validate and deploy selected Ansible playbook
        uses: Crafted-Beyond/github-action-workflow/.github/actions/run-ansible-playbook@main
        with:
          playbook: ${{ inputs.playbook }}
          inventory: ${{ inputs.inventory }}
          tags: ${{ inputs.tags }}
          check_connectivity: ${{ inputs.check_connectivity }}
          validation_playbooks: ${{ inputs.validation_playbooks }}
          validation_scripts: ${{ inputs.validation_scripts }}
          validation_inventory: ${{ inputs.validation_inventory }}
          working_directory: ${{ inputs.working_directory }}

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/id_rsa" "$RUNNER_TEMP/inventory.json" \
            "$RUNNER_TEMP/ansible-extra-vars.json" "$RUNNER_TEMP/cloudflared.deb" \
            "$HOME/.ssh/config"

name: CraftedBeyond combine workflow

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      registry:
        type: string
        default: docker.io
      registry_adapter:
        type: string
        default: dockerhub
      repository_visibility:
        description: Visibility for automatic Docker Hub repository creation, private or public. Existing repositories are unchanged.
        type: string
        default: private
      registry_cleanup_script:
        type: string
        default: ""
      release_branch:
        type: string
        default: main
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      platforms:
        type: string
        default: linux/arm64
      build_runs_on:
        type: string
        default: '"ubuntu-latest"'
      deploy_runs_on:
        description: Runner as JSON; GitHub-hosted Ubuntu by default.
        type: string
        default: '"ubuntu-latest"'
      kubectl_version:
        description: kubectl version within one minor version of the K3s API server.
        type: string
        default: v1.34.0
      infrastructure_repository:
        description: Repository containing Terraform; same-repository previews use the captured PR commit.
        type: string
        default: Crafted-Beyond/crb-craftedbeyond-k3s-terraform
      infrastructure_ref:
        description: Infrastructure revision for actual deployments or a separate infrastructure repository; same-repository previews use the image SHA.
        type: string
        default: main
      infrastructure_directory:
        description: Terraform root in the selected repository; defaults to applications/<calling-repository-name>.
        type: string
        default: ""
      deployment_var_file:
        description: Optional relative .tfvars or .tfvars.json path in the Terraform root; environment comes from this file and must match the selected GitHub environment.
        type: string
        default: ""
      preview_sha:
        description: Optional authorized PR SHA captured by prerequisite jobs; reject a changed PR head before building.
        type: string
        default: ""
      state_repository:
        description: Private owner/repository for OpenTofu state.
        type: string
        required: true
      state_ref:
        type: string
        default: main
      environment:
        description: Manual workflow_dispatch environment only, for example dev.
        type: string
        default: ""
      tag:
        description: Manual deployment version; empty selects the highest stable Git version on the release branch.
        type: string
        default: ""
      tofu_version:
        description: OpenTofu version.
        type: string
        default: latest
    secrets:
      GH_TOKEN:
        description: GitHub token for API operations and application, infrastructure, state and chart repositories.
        required: true
      registry_username:
        required: true
      registry_password:
        required: true
      kubeconfig:
        required: false
      chart_repository_url:
        description: HTTPS Git URL of the chart repository.
        required: false
      image_pull_username:
        required: false
      image_pull_password:
        required: false
      application_secrets:
        description: Optional JSON object of application-specific Terraform credentials.
        required: false

permissions: {}

jobs:
  image:
    name: ${{ github.event_name == 'pull_request' && 'Release image only' || (github.event.comment.body == '/combine-deploy' && 'Combine-deploy preview build' || 'PR image only') }}
    if: github.event_name == 'issue_comment' || github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    uses: Crafted-Beyond/github-action-workflow/.github/workflows/docker-image.yml@main
    with:
      image: ${{ inputs.image }}
      registry: ${{ inputs.registry }}
      registry_adapter: ${{ inputs.registry_adapter }}
      repository_visibility: ${{ inputs.repository_visibility }}
      registry_cleanup_script: ${{ inputs.registry_cleanup_script }}
      release_branch: ${{ inputs.release_branch }}
      context: ${{ inputs.context }}
      dockerfile: ${{ inputs.dockerfile }}
      platforms: ${{ inputs.platforms }}
      runs_on: ${{ inputs.build_runs_on }}
      allow_preview: true
      preview_sha: ${{ inputs.preview_sha }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      registry_username: ${{ secrets.registry_username }}
      registry_password: ${{ secrets.registry_password }}

  deploy:
    name: ${{ github.event_name == 'workflow_dispatch' && format('Deploy {0} - {1}', inputs.environment, inputs.tag || 'latest stable') || format('Combine-deploy preview - {0}', needs.image.outputs.tag) }}
    needs: image
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.image.result == 'success' && needs.image.outputs.preview == 'true'))
    runs-on: ${{ fromJSON(inputs.deploy_runs_on) }}
    timeout-minutes: 90
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
    concurrency:
      group: combine-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      IMAGE_REPOSITORY: ${{ inputs.image }}
      IMAGE_REGISTRY: ${{ inputs.registry }}
      REGISTRY_ADAPTER: ${{ inputs.registry_adapter }}
      REGISTRY_CLEANUP_SCRIPT: ${{ inputs.registry_cleanup_script }}
      REGISTRY_USERNAME: ${{ secrets.registry_username }}
      REGISTRY_PASSWORD: ${{ secrets.registry_password }}
      IMAGE_PULL_USERNAME: ${{ secrets.image_pull_username }}
      IMAGE_PULL_PASSWORD: ${{ secrets.image_pull_password }}
      RELEASE_BRANCH: ${{ inputs.release_branch }}
      BUILD_TAG: ${{ needs.image.outputs.tag }}
      BUILD_SHA: ${{ needs.image.outputs.sha }}
      BUILD_PREVIEW: ${{ needs.image.outputs.preview }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_TAG: ${{ inputs.tag }}
      INFRASTRUCTURE_DIRECTORY: ${{ inputs.infrastructure_directory }}
      DEPLOYMENT_VAR_FILE: ${{ inputs.deployment_var_file }}
      STATE_REPOSITORY: ${{ inputs.state_repository }}
      STATE_REF: ${{ inputs.state_ref }}
      TF_VAR_registry_username: ${{ secrets.image_pull_username || secrets.registry_username }}
      TF_VAR_registry_password: ${{ secrets.image_pull_password || secrets.registry_password }}
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
      TF_VAR_chart_repository_url: ${{ secrets.chart_repository_url }}
      TF_VAR_application_secrets: ${{ secrets.application_secrets || '{}' }}
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ inputs.kubectl_version }}

      - name: Checkout trusted custom registry adapter
        if: inputs.registry_adapter == 'custom'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GH_TOKEN }}
          ref: ${{ inputs.release_branch }}
          path: registry-control
          persist-credentials: false

      - name: Checkout deployment infrastructure at the selected source revision
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.infrastructure_repository }}
          ref: ${{ needs.image.outputs.preview == 'true' && inputs.infrastructure_repository == github.repository && needs.image.outputs.sha || inputs.infrastructure_ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: infrastructure
          persist-credentials: false

      - name: Resolve immutable image and deployment identity
        id: deployment
        uses: Crafted-Beyond/github-action-workflow/.github/actions/docker-release@main
        with:
          operation: deployment-prepare

      - name: Prepare credentials and runtime metadata
        shell: bash
        env:
          CLUSTER_CONFIG: ${{ secrets.kubeconfig }}
          WORKDIR: ${{ steps.deployment.outputs.working_directory }}
        run: |
          set -euo pipefail
          kubectl version --client
          test -n "$CLUSTER_CONFIG" || { echo "::error::The kubeconfig secret is required for deployment."; exit 1; }
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/combine-kubeconfig"
          printf 'KUBECONFIG=%s\nTF_VAR_kubeconfig_path=%s\n' "$KUBECONFIG" "$KUBECONFIG" >> "$GITHUB_ENV"
          printf '%s\n' "$CLUSTER_CONFIG" > "$KUBECONFIG"
          test -d "$WORKDIR" || { echo "::error::The selected infrastructure revision does not contain the configured Terraform root."; exit 1; }
          cp "$RUNNER_TEMP/combine.auto.tfvars.json" "$WORKDIR/combine.auto.tfvars.json"

      - name: Verify Kubernetes API connectivity
        shell: bash
        run: kubectl --request-timeout=30s get crd applications.argoproj.io appprojects.argoproj.io >/dev/null

      - name: Install OpenTofu
        uses: Crafted-Beyond/github-action-workflow/.github/actions/setup-tofu@main
        with:
          tofu_version: ${{ inputs.tofu_version }}

      - name: Serialize deployment and verify selected image
        id: lock
        uses: Crafted-Beyond/github-action-workflow/.github/actions/docker-release@main
        env:
          STATE_PATH: ${{ steps.deployment.outputs.state_path }}
          BUILD_SHA: ${{ steps.deployment.outputs.sha }}
          BUILD_TAG: ${{ steps.deployment.outputs.tag }}
          BUILD_PREVIEW: ${{ steps.deployment.outputs.preview }}
        with:
          operation: deployment-lock

      - name: Load isolated state
        id: state_pull
        uses: Crafted-Beyond/github-action-workflow/.github/actions/state-pull@main
        with:
          repository: ${{ inputs.state_repository }}
          token: ${{ secrets.GH_TOKEN }}
          ref: ${{ inputs.state_ref }}
          state_path: ${{ steps.deployment.outputs.state_path }}
          working_directory: ${{ steps.deployment.outputs.working_directory }}
          checkout_path: .combine-state

      - name: Configure authenticated Terraform module downloads
        working-directory: ${{ steps.deployment.outputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/combine-gitconfig"
          umask 077
          git config --file "$GIT_CONFIG_GLOBAL" "http.${GITHUB_SERVER_URL}/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          export GIT_TERMINAL_PROMPT=0
          source_sha=$(git -C "$GITHUB_WORKSPACE/infrastructure" rev-parse HEAD)
          printf 'TOFU_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"

      - name: Plan the exact image deployment
        id: plan
        uses: Crafted-Beyond/github-action-workflow/.github/actions/tofu-plan@main
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/combine-gitconfig
          GIT_TERMINAL_PROMPT: "0"
        with:
          working_directory: ${{ steps.deployment.outputs.working_directory }}
          var_file: ${{ inputs.deployment_var_file }}
          title: ${{ steps.deployment.outputs.state_path }}

      - name: Update API Terraform plan PR comment
        if: ${{ !cancelled() && steps.deployment.outputs.preview == 'true' && steps.plan.outputs.summary_file != '' }}
        uses: Crafted-Beyond/github-action-workflow/.github/actions/pr-comment@main
        with:
          token: ${{ secrets.GH_TOKEN }}
          pr_number: ${{ github.event.issue.number }}
          body_file: ${{ steps.plan.outputs.summary_file }}
          marker: tofu-plan:${{ steps.deployment.outputs.state_path }}

      - name: Apply deployment prerequisites and Argo CD Application
        id: apply
        uses: Crafted-Beyond/github-action-workflow/.github/actions/tofu-apply@main
        with:
          working_directory: ${{ steps.deployment.outputs.working_directory }}
          title: ${{ steps.deployment.outputs.state_path }}

      - name: Persist state even after a partial apply
        id: state
        if: ${{ always() && (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure') }}
        uses: Crafted-Beyond/github-action-workflow/.github/actions/state-push@main
        with:
          state_path: ${{ steps.deployment.outputs.state_path }}
          ref: ${{ inputs.state_ref }}
          working_directory: ${{ steps.deployment.outputs.working_directory }}
          checkout_path: .combine-state

      - name: Read Terraform deployment outputs
        id: configured
        if: steps.apply.outcome == 'success' && steps.state.outcome == 'success'
        uses: Crafted-Beyond/github-action-workflow/.github/actions/docker-release@main
        env:
          BUILD_TAG: ${{ steps.deployment.outputs.tag }}
        with:
          operation: deployment-outputs

      - name: Append API apply result to the PR report
        if: ${{ !cancelled() && steps.deployment.outputs.preview == 'true' && (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure') }}
        shell: bash
        env:
          SUMMARY_FILE: ${{ steps.plan.outputs.summary_file }}
          STATE_SAVED: ${{ steps.state.outcome == 'success' }}
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/tofu-apply.md" >> "$SUMMARY_FILE"
          printf '\nBackend state saved: **%s**.\n' "$STATE_SAVED" >> "$SUMMARY_FILE"

      - name: Update API Terraform apply PR comment
        if: ${{ !cancelled() && steps.deployment.outputs.preview == 'true' && (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure') }}
        uses: Crafted-Beyond/github-action-workflow/.github/actions/pr-comment@main
        with:
          token: ${{ secrets.GH_TOKEN }}
          pr_number: ${{ github.event.issue.number }}
          body_file: ${{ steps.plan.outputs.summary_file }}
          marker: tofu-plan:${{ steps.deployment.outputs.state_path }}

      - name: Wait for Argo CD health
        id: healthy
        if: steps.apply.outcome == 'success' && steps.state.outcome == 'success'
        uses: Crafted-Beyond/github-action-workflow/.github/actions/docker-release@main
        env:
          STATE_PATH: ${{ steps.deployment.outputs.state_path }}
          BUILD_SHA: ${{ steps.deployment.outputs.sha }}
          BUILD_TAG: ${{ steps.deployment.outputs.tag }}
          BUILD_PREVIEW: ${{ steps.deployment.outputs.preview }}
          DEPLOY_NAME: ${{ steps.configured.outputs.name }}
          DEPLOY_NAMESPACE: ${{ steps.configured.outputs.namespace }}
          DEPLOY_ROUTE_ENABLED: ${{ steps.configured.outputs.route_enabled }}
          ARGOCD_NAMESPACE: ${{ steps.configured.outputs.argocd_namespace }}
        with:
          operation: deployment-complete

      - name: Release deployment lock
        if: ${{ always() && steps.lock.outcome == 'success' }}
        uses: Crafted-Beyond/github-action-workflow/.github/actions/docker-release@main
        env:
          STATE_PATH: ${{ steps.deployment.outputs.state_path }}
          STATE_SAFE: ${{ (steps.apply.outcome != 'success' && steps.apply.outcome != 'failure') || steps.state.outcome == 'success' }}
        with:
          operation: unlock

      - name: Report deployment result
        if: always()
        uses: Crafted-Beyond/github-action-workflow/.github/actions/docker-release@main
        env:
          REPORT_BODY: >-
            Deployment ${{ steps.healthy.outputs.healthy == 'true' && 'succeeded' || 'failed' }}.
            Application: ${{ steps.configured.outputs.name }}.
            Image: ${{ inputs.registry }}/${{ inputs.image }}:${{ steps.deployment.outputs.tag }}.
            Hostname: ${{ steps.configured.outputs.hostname }}.
            Preview cleanup, when enabled, is managed by the calling workflow.
        with:
          operation: report

      - name: Clean deployment files
        if: always()
        uses: Crafted-Beyond/github-action-workflow/.github/actions/docker-release@main
        env:
          PRESERVE_DEPLOYMENT_STATE: ${{ steps.state.outcome == 'failure' }}
        with:
          operation: deployment-cleanup

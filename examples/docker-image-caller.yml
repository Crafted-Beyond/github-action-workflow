name: Docker image
run-name: >-
  ${{ github.event_name == 'pull_request' && (github.event.pull_request.merged && 'Release image build' || 'Closed PR (no build)') || 'PR image build request' }}
  | ${{ join(github.event.pull_request.labels.*.name, ', ') || join(github.event.issue.labels.*.name, ', ') || 'no labels' }}
  | PR #${{ github.event.issue.number || github.event.pull_request.number }}

on:
  pull_request:
    branches: [main]
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  image:
    uses: Crafted-Beyond/github-action-workflow/.github/workflows/docker-image.yml@main
    with:
      image: craftedbeyond/REPLACE_WITH_IMAGE_NAME
      # registry defaults to docker.io
      platforms: linux/arm64
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      registry_username: ${{ vars.DOCKERHUB_USERNAME }}
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}

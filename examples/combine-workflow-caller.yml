name: CraftedBeyond application
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Deploy {0}', inputs.environment) ||
      (github.event_name == 'pull_request' && (github.event.pull_request.merged && 'Release image build (no deploy)' || 'Closed PR (no build)')) ||
      (github.event.comment.body == '/combine-deploy' && 'Combine-deploy preview (build + deploy)' || 'PR image build request') }}
  | ${{ github.event_name == 'workflow_dispatch' && (inputs.tag || 'latest stable') ||
      join(github.event.pull_request.labels.*.name, ', ') ||
      join(github.event.issue.labels.*.name, ', ') || 'no labels' }}
  | ${{ github.event_name == 'workflow_dispatch' && github.ref_name ||
      format('PR #{0}', github.event.issue.number || github.event.pull_request.number) }}

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      environment:
        description: Actual deployment environment.
        type: environment
        required: true
        default: dev
      tag:
        description: Stable release version; empty selects the highest stable Git version on main.
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  combine:
    uses: Crafted-Beyond/github-action-workflow/.github/workflows/combine-workflow.yml@main
    with:
      image: craftedbeyond/REPLACE_WITH_IMAGE_NAME
      state_repository: Crafted-Beyond/REPLACE_WITH_PRIVATE_STATE_REPOSITORY
      deploy_runs_on: '"ubuntu-latest"'
      environment: ${{ inputs.environment || '' }}
      tag: ${{ inputs.tag || '' }}
      # App settings live in applications/<repository-name>/main.tf in the central repository.
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      registry_username: ${{ vars.DOCKERHUB_USERNAME }}
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
      kubeconfig: ${{ secrets.KUBECONFIG }}
      chart_repository_url: ${{ vars.CHART_REPOSITORY_URL }}
      image_pull_username: ${{ secrets.IMAGE_PULL_USERNAME }}
      image_pull_password: ${{ secrets.IMAGE_PULL_PASSWORD }}
